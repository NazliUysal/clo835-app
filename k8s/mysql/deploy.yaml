apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deploy
  namespace: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: 851725335686.dkr.ecr.us-east-1.amazonaws.com/mysql-repo:v1
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "pass123"
        - name: MYSQL_DATABASE
          value: "employees"
        ports:
        - containerPort: 3306
